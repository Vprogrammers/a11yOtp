name: iOS SwiftLint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Mint builds
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}

      - name: Install Mint
        run: brew install mint

      - name: Run SwiftLint
        run: ./scripts/swiftlint.sh --reporter github-actions-logging
