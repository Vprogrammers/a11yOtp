name: iOS SwiftLint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Mint
        run: brew install mint

      - name: Run SwiftLint
        run: ./scripts/swiftlint.sh --reporter github-actions-logging
