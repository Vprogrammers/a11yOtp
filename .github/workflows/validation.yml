name: Validation

# Standard GitHub-hosted runners are free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Checks to run
        type: choice
        options: [all, kmp, android, ios]
        default: all
      android-device-tests:
        description: Also run the Android device tests on an emulator (slow)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Shared and Android (JVM)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "kmp", "android"]'), inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Shared and Android host tests
        run: ./gradlew :a11yotp:testAndroidHostTest :a11yotp-sms-retriever:testAndroidHostTest

      - name: Compile Android device tests
        run: ./gradlew :a11yotp:compileAndroidDeviceTest

      - name: Android sample
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            */build/reports/tests/
            */build/reports/ktlint/
          retention-days: 7

  ios:
    name: iOS (Apple Silicon)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "kmp", "ios"]'), inputs.target)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Kotlin/Native tests on the iOS simulator
        run: ./gradlew :a11yotp:iosSimulatorArm64Test

      - name: Link the Shared framework
        run: ./gradlew :sampleShared:linkDebugFrameworkIosSimulatorArm64

      - name: Cache Mint builds
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}

      - name: Install Mint
        run: brew install mint

      - name: SwiftLint
        run: ./scripts/swiftlint.sh --reporter github-actions-logging

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, ds in devices.items() if ".iOS-" in runtime
                    for d in ds if d["name"].startswith("iPhone")]
          version = lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")]
          phones.sort(key=lambda p: version(p[0]))
          print(phones[-1][1]["udid"])
          ')
          echo "udid=${udid}" >> "${GITHUB_OUTPUT}"

      - name: iOS UI tests on the simulator
        run: >
          xcodebuild test
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -destination "id=${{ steps.simulator.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: a11yotp/build/reports/tests/
          retention-days: 7

  android-device:
    name: Android device tests (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.android-device-tests && contains(fromJSON('["all", "android"]'), inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew :a11yotp:connectedAndroidDeviceTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          path: a11yotp/build/reports/androidTests/
          retention-days: 7
