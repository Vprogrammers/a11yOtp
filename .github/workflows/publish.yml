name: Publish

# Releases VERSION_NAME from gradle.properties to Maven Central. Runs only when started by hand,
# only from main, after the full validation, and only after approval in the `release` environment.
# The upload waits in the Central Portal until it is published there by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  checks:
    name: Validation
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validation.yml
    with:
      target: all
      android-device-tests: true

  publish:
    name: Publish to Maven Central
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "${version}" == *SNAPSHOT ]]; then
            echo "::error::VERSION_NAME '${version}' is not a release version"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Refuse an existing version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists. Raise VERSION_NAME first."
            exit 1
          fi
          for artifact in a11yotp a11yotp-sms-retriever; do
            url="https://repo1.maven.org/maven2/me/vprogrammers/${artifact}/${VERSION}/${artifact}-${VERSION}.pom"
            if curl --silent --fail --head "${url}" >/dev/null; then
              echo "::error::me.vprogrammers:${artifact}:${VERSION} is already on Maven Central."
              exit 1
            fi
          done

      - name: Require publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret ${name} is not set in the release environment."
              exit 1
            fi
          done

      - name: Verify the publication with a clean consumer
        run: ./scripts/verify-publication.sh

      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      - name: Tag and draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "A11yOtp ${VERSION}" \
            --generate-notes \
            --draft
