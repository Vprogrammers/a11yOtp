[versions]
agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidxCompose = "1.12.1"
# Pinned above the Compose test default: older Espresso crashes on API 37 (InputManager.getInstance removed)
androidx-test-espresso = "3.7.0"
kotlin = "2.4.21"
ktlintPlugin = "14.2.0"
ktlintVersion = "1.8.0"
mavenPublish = "0.37.0"
playServicesAuthApiPhone = "18.3.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidxCompose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidxCompose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidxCompose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidxCompose" }
compose-uiTest = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidxCompose" }
compose-uiTestAccessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility", version.ref = "androidxCompose" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxCompose" }
compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidxCompose" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
play-services-auth-api-phone = { module = "com.google.android.gms:play-services-auth-api-phone", version.ref = "playServicesAuthApiPhone" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
